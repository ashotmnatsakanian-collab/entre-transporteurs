services:
  - type: web
    name: entre-transporteurs
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: |
      npm install &&
      npx prisma generate &&
      npx prisma migrate deploy &&
      npm run build
    startCommand: npx tsx server.ts
    healthCheckPath: /api/auth/providers
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=450
      - key: PORT
        value: 3000
      # ── Obligatoires ────────────────────────────────────────────────────────
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: NEXTAUTH_URL
        sync: false          # ex: https://entre-transporteurs.onrender.com
      - key: NEXTAUTH_SECRET
        generateValue: true  # généré automatiquement par Render
      # ── Optionnels (Stripe — à ajouter quand tu veux monétiser) ─────────────
      # - key: STRIPE_SECRET_KEY
      #   sync: false
      # - key: STRIPE_PUBLISHABLE_KEY
      #   sync: false
      # - key: STRIPE_PRICE_ID
      #   sync: false
      # - key: STRIPE_WEBHOOK_SECRET
      #   sync: false
